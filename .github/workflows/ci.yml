name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install --ignore-scripts
      
      - name: Compile
        run: npm run compile
      
      - name: Run Tests
        run: npm test
        continue-on-error: true

  validate-docs:
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result != 'cancelled'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install --ignore-scripts
      
      - name: Compile
        run: npm run compile
      
      - name: Scan Documentation
        run: npm run scan --if-present
        continue-on-error: true
      
      - name: Validate Documentation
        run: npm run validate --if-present
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm install --ignore-scripts
      
      - name: Compile
        run: npm run compile
      
      - name: Package Extension
        run: |
          # vsce akzeptiert keine scoped npm-Namen als Extension-Namen. Das
          # Paket heisst seit der Registry-Umstellung
          # "@noyrax/documentation-system-plugin", damit mcp-server es als
          # Abhaengigkeit aufloesen kann -- fuer die VSIX muss daraus wieder
          # der unscoped Name werden, unter dem die Extension schon immer
          # gepackt wurde. Nur fuer diesen Schritt, die Datei im Repository
          # bleibt unveraendert.
          # Zusaetzlich die "files"-Liste entfernen: sie steuert den
          # npm-Publish, vsce lehnt sie aber zusammen mit einer .vscodeignore
          # ab ("VSCE does not support combining both strategies"). Fuer die
          # VSIX gilt .vscodeignore.
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.name='noyrax';delete j.files;fs.writeFileSync('package.json',JSON.stringify(j,null,2));"
          npx @vscode/vsce package
          git checkout -- package.json
      
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: noyrax-vsix
          path: '*.vsix'
